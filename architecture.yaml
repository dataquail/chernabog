# yaml-language-server: $schema=https://dataquail.github.io/goodbones/schema/architecture.schema.json
#
# The architecture policy for chernabog, as one manifest. Its shape follows
# dataquail/functional-domain-driven-hexagon's: commands and queries over a
# domain of aggregates, driven by inbound adapters, with persistence and external systems
# behind ports (docs/adr/0001-ddd-use-cases-and-ports.md). AGENTS.md says how
# to run it and how to change it.
#
# It reads like a directory listing — a key ending in `/` is a folder, anything
# else is a file — and everything the policy says about a part of the tree is
# written at that part of the tree.
#
# Patterns are globs over repo-relative paths, matched against FULLY RESOLVED
# targets:
#
#   *          part of one path segment          {name}   captures one segment
#   **         any number of segments            [A-Z]    a character class
#   a/**       `a` itself as well as a/b/c       |        several patterns, one node
#
# Every glob and every message is quoted: `*`, `@`, a backtick and `{` all mean
# something to YAML when bare.
#
# The policy is tight on the new tree (src/modules/, src/kernel/,
# src/interface/) and honest about the old one: the flat src/*.ts files and
# the folders beside them are one `unrestricted`, `layout: open` node. Each
# migration moves files out of it, and the limits below only ever tighten.

baseline: .architecture-baseline.json

resolve:
  scopes:
    - files: ""
      language: typescript
      options: { tsconfig: tsconfig.json }
  # An import nobody can resolve is an import no rule can police.
  unresolved: error
  ignoreUnresolved:
    # Bun's runtime modules (bun:test, bun:sqlite) have no file on disk.
    - "^bun:"

aliases:
  "@": src
  "~": packages

# Ratchets on the policy itself: the ceilings are how many tiers may say "not
# tightened yet" and how much acknowledged debt the conformance report may
# show; the floors are how much of the tree each family must reach, as
# `bun run architecture:coverage` reported it, rounded down. Raise a floor or
# lower a ceiling when a migration earns it; never move one the other way to
# make a red run green.
limits:
  unrestricted: 1
  partial: 0
  coverage: { imports: 0.94, structure: 0.85, members: 0.52, surface: 0.94, graph: 1 }
  conformance: { residue: 0, vacant: 0, slack: 0, concentration: 0 }

# Prohibitions that hold for every file in the repo.
deny:
  - match: "**/*.test.ts"
    message: >-
      This file depends on a test. A test's only job is to test; a fixture two tests share belongs
      in a harness beside them (test/*.ts), not inside one of them.
  - match: "**/node_modules/yaml/**"
    except:
      - "**/infrastructure/repositories/**"
      - "@/modules/*/queries/**"
      - "@/*.ts"
      - "test/**"
    message: >-
      The yaml package is how machine config is stored, not what it means. Only a repository
      adapter (infrastructure/repositories/) writes a YAML document, and only it and a query,
      which reads its storage directly (docs/adr/0011-queries-read-their-storage.md), read one;
      the domain and the commands see aggregates, never a Document.
  - match: "**/node_modules/@effect/sql*/**"
    except:
      - "@/modules/runs/infrastructure/**"
      - "@/modules/runs/queries/**"
      - "test/**"
    message: >-
      SQLite is where runs and the workflow journal are stored. Only the runs module's
      infrastructure and the engine name the SQL client, and the runs module's queries, which
      read state.db directly (docs/adr/0011-queries-read-their-storage.md); everything else
      writes runs through the Run repository and reads them through a runs query.
  - match: "**/node_modules/@opentui/**"
    except: ["@/interface/tui/**"]
    message: >-
      @opentui is the TUI's renderer. Only the TUI names it, so the rest of the code stays
      runnable without a terminal.

# Rules about the shape of the whole import graph. Only `bun run
# lint:architecture` evaluates them; the oxlint plugin compiles and probes them.
graph:
  cycles:
    - name: no-cycles
      message: >-
        These files import each other, so none of them can be understood, tested or loaded
        without the rest. Break the cycle by moving the shared piece below both, or by inverting
        one edge through a port.
      within: ["@/**", "~/**", "test/**", "scripts/**"]
  orphans:
    - name: no-orphans
      message: >-
        Nothing imports this file and it is not an entry point. Delete it, or, if something
        outside the import graph loads it by design, list it under `entry` with the reason.
      within: ["@/**", "~/**", "test/**", "scripts/**"]
      # A fake is owed to its port, whether or not a test currently takes it.
      withinNot: "**/*-fake.ts"
      entry:
        # bun test loads these by glob.
        - "**/*.test.ts"
        # The CLI binary (`bun build --compile src/interface/cli/main.ts`).
        - "@/interface/cli/main.ts"
        # The published packages' entries (their package.json `exports`).
        - "~/core/src/index.ts"
        - "~/sdk/src/index.ts"
        # What a compiled binary resolves the SDK to: its root index (packages/sdk/index.ts).
        - "~/sdk/index.ts"
        # Run with `bun scripts/<name>.ts`.
        - "scripts/gen-*.ts"
        - "scripts/homebrew-formula.ts"
        - "scripts/coverage-summary.ts"
        - "scripts/release-pr-check.ts"
        # The acceptance sandbox runs it as a child process, for a lockfile.
        - "test/acceptance/lockfile.ts"
        # A repo's flows are loaded by path (src/platform/flow-loader.ts): these
        # are the recipes `chernabog recipes add` copies and a repo's
        # `flows.<name>.from` imports.
        - "~/recipes/**"
  reach:
    - name: domain-reaches-no-adapter
      message: >-
        A module's domain transitively reaches an adapter. The domain sees effect, the kernel and
        its own module's domain; a route from it to infrastructure/, interface/ or platform/
        means a file on the route has widened past what the domain may know about.
      from: "@/modules/*/domain/**"
      fromNot: "**/*.test.ts"
      to:
        - "@/modules/*/infrastructure/**"
        - "@/interface/**"
        - "@/platform/**"
    - name: handlers-reach-no-adapter
      message: >-
        A command or query transitively reaches an adapter. A command or query depends on its
        module's domain and ports; the adapters are wired against them at a composition root, never
        beneath them.
      from:
        - "@/modules/*/commands/**"
        - "@/modules/*/queries/**"
      fromNot: "**/*.test.ts"
      to:
        - "@/modules/*/infrastructure/**"
        - "@/interface/**"
        - "@/platform/**"
      # Where chernabog keeps its files, which a query reads directly
      # (docs/adr/0011-queries-read-their-storage.md). It names no adapter.
      toNot: ["@/platform/home.ts"]
    - name: packages-reach-no-daemon
      message: >-
        @chernabog/core and @chernabog/sdk are published and run inside a person's flows. A route
        from either into src/ would ship the daemon's internals with them, or fail to resolve once
        they are installed.
      from: "~/{core,sdk}/**"
      to: "@/**"
    - name: daemon-reaches-no-sdk
      message: >-
        The binary provides @chernabog/core and nothing else of the flows' packages: each repo
        installs the @chernabog/sdk it pins, and the loader resolves it from there. A route from
        src/ into the SDK's code would run this checkout's blocks in place of the repo's
        (docs/adr/0004-core-abi.md). What the daemon itself acts on, such as claims and markers,
        belongs in core.
      from: "@/**"
      to: "~/sdk/src/**"

defs:
  # A default export has no canonical name, so every importer invents one.
  no-default-exports:
    message: >-
      No default exports: a default has no canonical name, so every importer invents one and the
      symbol becomes ungreppable. Export it by name.
    kinds: [default]

  no-star-exports:
    message: >-
      No `export *`: a star re-export republishes every name of its target, so a reader can't
      see what a file offers. Re-export by name.
    kinds: [namespace]

  specification:
    message: >-
      A specification (*.specification.ts) is a named domain predicate over an aggregate, which
      its repository's reads take; add the sibling *.specification.test.ts.
    requires: ["{base}.test.ts"]

  # What a handler file exports: the one handler, named for its message.
  one-handler-export:
    message: >-
      A handler file exports exactly one `<verbNoun>Handler`, for the message in its sibling
      *.command.ts or *.query.ts. A second one is a second message that wants its own files; none
      means this isn't a handler.
    declares: [function, variable]
    match: "*Handler"
    count: { min: 1, max: 1 }

  # A handler's other value exports are named as it is (ADR-0024 in the
  # hexagon; docs/adr/0009-the-hexagons-remaining-stereotypes.md).
  camel-case-value-exports:
    message: >-
      A handler's value exports are camelCase: `{name}` is not. The handler is `<verbNoun>Handler`,
      and a helper it publishes is named the same way.
    declares: [function, variable]
    convention: camelCase
    probe:
      source: "export const ZzHandler = () => 1;"

  # The identifier carries its file's stereotype, so a call site says what it
  # names: XRoot, XRootOps, XEntity, XId
  # (docs/adr/0009-the-hexagons-remaining-stereotypes.md).
  root-exports:
    message: >-
      An aggregate root file exports its root, named `<Aggregate>Root`: `{name}` is not. A status
      or other value the root carries is a value object in its own *.value-object.ts.
    declares: [function, class, variable, enum]
    allow: ["*Root"]
    probe:
      source: "export const ZzStatus = 1;"

  root-ops-exports:
    message: >-
      An aggregate's operations file exports one bag, `<Aggregate>RootOps`: `{name}` is not. An op
      is a member of the bag, so a call site reads `XRootOps.op(…)`.
    declares: [function, class, variable, enum]
    allow: ["*RootOps"]
    probe:
      source: "export const zzOp = () => 1;"

  aggregate-ops-exports:
    message: >-
      A constituent aggregate's operations file exports one bag, `<Name>AggregateOps`: `{name}` is
      not.
    declares: [function, class, variable, enum]
    allow: ["*AggregateOps"]
    probe:
      source: "export const zzOp = () => 1;"

  entity-exports:
    message: >-
      An entity file exports its entity, named `<Name>Entity`: `{name}` is not.
    declares: [function, class, variable, enum]
    allow: ["*Entity"]
    probe:
      source: "export class ZzStep {}"

  id-exports:
    message: >-
      An id file's value exports are ids, named `<Name>Id`: `{name}` is not.
    declares: [function, class, variable, enum]
    allow: ["*Id"]
    probe:
      source: "export const ZzSlug = 1;"

  # The constituent operations bags: invariant logic on an aggregate's
  # internals, which only the domain composes, each owing a sibling test.
  constituent-ops:
    message: >-
      A constituent operations bag (*.aggregate-ops.ts) is domain-private invariant logic; add the
      sibling *.aggregate-ops.test.ts.
    requires: ["{base}.test.ts"]
    importedBy:
      message: >-
        A constituent operations bag encodes invariants on an aggregate's internals. It is
        domain-private: only its module's own domain/ composes it, and nothing outside domain/
        touches it. Change the aggregate through its root's ops: a command, query or adapter
        reaching for a constituent op is bypassing the root.
      allow: ["@/modules/*/domain/**", "**/*.test.ts"]

  # A port is a declaration: the service's shape and the Context.Service class
  # that names it. A value beside them is an implementation.
  port-declares-no-value:
    message: >-
      A port declares a shape and the Context.Service that names it. `{name}` is a value: an
      implementation belongs in infrastructure/ behind the port.
    declares: [function, variable]

  # A port is consumed by its module's domain, commands and queries,
  # by the adapter that implements it and by the module and maps that wire them.
  port-consumers:
    message: >-
      A port is consumed by its module's commands and queries, the infrastructure adapter that
      implements it, and the module's wiring and handler maps. An adapter in interface/ or another
      module reaching for one is bypassing the module's boundary: dispatch a command or query
      instead.
    allow:
      - "@/modules/*/domain/**"
      - "@/modules/*/commands/**"
      - "@/modules/*/queries/**"
      - "@/modules/*/infrastructure/**"
      - "@/modules/*/*.module.ts"
      - "@/modules/*/*.command-handlers.ts"
      - "@/modules/*/*.query-handlers.ts"
      - "**/*.test.ts"

  # An ACL port is the question a module asks another, in its own words
  # (docs/adr/0009-modules-import-and-export.md). Its handlers ask it, and its
  # ACL adapter answers it; nothing outside the module may, since the answer
  # is another module's and the platform asks that module itself.
  acl-port-consumers:
    message: >-
      An ACL port (domain/ports/acl/) is consumed by its module's commands and queries and by
      the ACL adapter that implements it (infrastructure/acl/), nothing else. An adapter in
      interface/ wanting another module's answer dispatches that module's query itself.
    allow:
      - "@/modules/*/commands/**"
      - "@/modules/*/queries/**"
      - "@/modules/*/infrastructure/**"
      - "**/*.test.ts"

  # An ACL adapter's live test runs it over the module it asks, staged with
  # its own handlers and storage by the shared harness.
  acl-test-file:
    surface: [{ use: test-exports-nothing }]
    imports:
      reset: true
      message: >-
        An ACL adapter's test names its module and the shared test harness (test/*.ts), which
        stages the module the adapter asks with that module's own handlers over real storage.
      external: [effect]
      allow: ["@/modules/{module}/**", "test/*.ts"]

  # A domain test names its subject and the kernel.
  unit-test-file:
    surface: [{ use: test-exports-nothing }]
    imports:
      reset: true
      message: >-
        A domain test names its subject, the kernel and effect. It runs no adapter.
      external: [effect]
      allow: ["@/kernel/**", "@/modules/{module}/domain/**"]

  # A handler test runs its subject over the module's fakes.
  module-test-file:
    surface: [{ use: test-exports-nothing }]
    imports:
      reset: true
      message: >-
        A handler test names its module, the kernel and the shared test harness
        (test/*.ts) — scripted askers and fixtures. It runs over the module's fakes, in the
        unit-of-work library's pass-through unit of work.
      external: [effect, "@effect-server-utils/unit-of-work"]
      allow: ["@/kernel/**", "@/modules/{module}/**", "test/*.ts"]

  # A mapper's test reads a stored row back as its aggregate, with no store.
  mapper-test-file:
    surface: [{ use: test-exports-nothing }]
    imports:
      reset: true
      message: >-
        A mapper's test names its mapper, its module's domain, the kernel and effect. It runs no
        store: a row is a value.
      external: [effect]
      allow:
        - "@/kernel/**"
        - "@/modules/{module}/domain/**"
        - "@/modules/{module}/infrastructure/repositories/*.mapper.ts"

  # A query handler's test runs its subject over real storage: a scratch home or
  # checkout on the real filesystem, and a real SQLite state.db. Only the clients
  # of third-party systems (GitHub, launchd, an agent CLI) keep their fakes.
  query-integration-test-file:
    surface: [{ use: test-exports-nothing }]
    imports:
      reset: true
      message: >-
        A query's integration test names its module (its live repositories and clients among
        them), the kernel, the home, the platform's exec and Bun's platform services (for git in a
        scratch repo, as a client's live test runs it) and the shared test harness (test/*.ts) —
        the scratch home and the SQLite state.db of test/sqlite.ts. It seeds through the live
        repository or writes the file the live adapter would; only a third-party system's
        client keeps its fake.
      external: [effect, "@effect/platform-bun"]
      allow:
        - "@/kernel/**"
        - "@/modules/{module}/**"
        - "@/platform/home.ts"
        - "@/platform/exec.ts"
        - "test/*.ts"
      deny:
        - match: "@/modules/{module}/infrastructure/repositories/*.repository-fake.ts"
          message: >-
            A query's integration test reads real storage. Seed it through the live repository,
            or write the file the live adapter would, never through a repository fake.

  # A repository adapter's test runs the live adapter over a scratch home.
  adapter-test-file:
    surface: [{ use: test-exports-nothing }]
    imports:
      reset: true
      message: >-
        A repository adapter's test names its module, the kernel, the home and the shared test
        harness (test/*.ts) — the scratch home and fixtures.
      external: [effect]
      allow: ["@/kernel/**", "@/modules/{module}/**", "@/platform/home.ts", "test/*.ts"]

  # state.db's transaction driver's test runs the unit-of-work library's unit
  # of work over the driver, against a real SQLite database.
  transaction-driver-test-file:
    surface: [{ use: test-exports-nothing }]
    imports:
      reset: true
      message: >-
        A transaction driver's test names its module, the shared test harness (test/*.ts) — a
        scratch SQLite database — and the unit-of-work library it runs the driver under.
      external: [effect, "@effect-server-utils/unit-of-work"]
      allow: ["@/modules/{module}/**", "test/*.ts"]

  # A handler answers with its result; saying it, asking a person or ending
  # the process is the adapter's (docs/adr/0001-ddd-use-cases-and-ports.md,
  # decisions 4 and 5).
  no-talking:
    message: >-
      `{name}` talks to a person or ends the process. A handler and the domain return a result
      and fail with tagged errors; the adapter that called them prints, prompts and sets the exit
      code.
    subject: calls
    match: [log, warn, exit, pick, choose]
    probe:
      source: 'export const zzHandler = () => Console.log("done");'
      name: log

  no-in-place-writes:
    message: >-
      `{name}` rewrites a file in place, truncating it first: a write cut short leaves it empty
      or partial, and two writers at once lose one's change. A repository persists state with
      updateFile (src/platform/file-lock.ts), which locks, checks and replaces the file whole.
    subject: calls
    match: [writeFileString, writeFile]
    probe:
      source: 'export const zz = (fs: Fs) => fs.writeFileString("state.json", "{}");'
      name: writeFileString

  # What a composition root of the CLI may name: each module's platform surface
  # (its layers, buses and value objects, and for runs the runtime it still
  # publishes), the interface, the platform and the kernel, and, file by file,
  # the legacy it still composes directly.
  cli-root:
    imports:
      reset: true
      message: >-
        A CLI composition root merges the modules through src/interface/application-modules.ts
        and names each module through its <module>.platform.ts (its buses and the value objects
        and events those answer with, and the runtime the runs module still publishes), the
        interface, the platform and the kernel, and the legacy files it still composes directly,
        each named here until a module owns it.
      # @effect-server-utils/cqrs for the EventBus a root provides its modules' commands.
      external: [effect, "@effect/platform-bun", "@effect-server-utils/cqrs"]
      allow:
        - "@/kernel/**"
        - "@/platform/**"
        - "@/interface/**"
        - "@/modules/*/*.platform.ts"
        - "~/core/src/**"
        - "@/migrate.ts"
        - "@/repo-config.ts"

  test-exports-nothing:
    message: >-
      A test exports nothing. Nothing may import a test, so an export here has no consumer; a
      fixture two tests share belongs in a harness beside them.
    count: { max: 0 }

  # A recipe's flow is a file the loader reads by its default export.
  flow-exports-only-itself:
    message: >-
      A recipe's flow file exports only its default, the defineFlow the loader reads. A block two
      flows share belongs in the SDK.
    count: { max: 1 }

tree:
  "@/":
    message: >-
      src/ holds the daemon and CLI. New code goes under modules/ (a module's domain, commands,
      queries and infrastructure), kernel/ (domain primitives every module shares) or interface/ (the
      inbound adapters). The flat files beside them are the legacy tier the migration empties.
    imports:
      unrestricted: true
      message: >-
        The legacy tier has no allowlist yet. Each migration moves files out of it into a tier
        that has one.
    surface:
      - use: no-default-exports
        # Bun imports the generated templates with `with { type: 'file' }`.
        except: ["@/platform/templates.ts"]
      - use: no-star-exports
    children:
      # The legacy tier: flat files and the folders beside them, not yet
      # sorted into modules. A migration deletes from here.
      "*.ts": {}

      "platform/":
        message: >-
          platform/ holds the technical adapters every module and adapter shares: running
          commands (exec.ts), the host environment, chernabog's home, GitHub's API and the
          personas' tokens, where the agents keep their logins, this program's name and
          version, the engine's lock, and a repo's .chernabog/ as code: its flows loaded
          (flow-loader.ts), its tree on the base branch (config-snapshot.ts), its pins
          (flow-deps.ts), and the scaffold and recipes this binary bundles (templates.ts).
        name: kebab-case
        imports:
          reset: true
          message: >-
            A platform adapter wraps the machine. It names effect, node, the SDK (for its error
            descriptions and types), the kernel and its siblings, and chernabog's package.json for
            its version; nothing of the modules, the interface or the legacy tier. The unit of
            work the file stores' commands declare names the CQRS and unit-of-work libraries.
          external: [effect, "@effect-server-utils/cqrs", "@effect-server-utils/unit-of-work"]
          allow:
            - "node:**"
            - "~/core/src/**"
            # The pins a repo's .chernabog/ gets: the bundled core's version, and the
            # SDK's released with it.
            - "~/core/package.json"
            - "~/sdk/package.json"
            - "@/kernel/**"
            - "@/platform/**"
            - "package.json"
        children:
          "*.test.ts":
            surface: [{ use: test-exports-nothing }]
            imports:
              message: >-
                A platform test drives its adapter, over the shared test harness.
              allow: ["test/*.ts"]
          "*.ts": {}

      "interface/":
        message: >-
          interface/ holds the inbound adapters, one folder per protocol: cli/ today, the daemon's
          scheduler and socket and an MCP server later.
        name: kebab-case
        children:
          # The one list of modules (ADR 12), which every composition root merges
          # beneath its own services: the CLI's, the daemon's, the *.main.ts
          # roots' and the tests'. A module added here is wired everywhere.
          "application-modules.ts":
            imports:
              reset: true
              message: >-
                The list of modules names each module's <module>.module.ts through its
                <module>.platform.ts, and effect to merge them. It wires nothing of its own: a
                service that differs between roots is each root's to provide.
              external: [effect]
              allow: ["@/modules/*/*.platform.ts"]
            importedBy:
              message: >-
                The list of modules is for the composition roots: the CLI's main.ts, a
                *.main.ts that composes its own engine, the daemon's server and the tests. An
                inbound adapter dispatches a module's commands and queries instead.
              allow:
                - "@/interface/cli/main.ts"
                - "@/interface/cli/*/*.main.ts"
                - "@/interface/daemon/*.server.ts"
                - "test/**"

          "cli/":
            message: >-
              cli/ holds the shared arguments (*.arguments.ts) and output (*.output.ts) and, per
              module, one <command>.command.ts per CLI command: its flags, the command or query it
              dispatches, and how its result reads, beside the output its commands share.
            imports:
              reset: true
              message: >-
                A CLI command parses its arguments, dispatches a command or query and prints what
                its result says. It names effect (its CLI and console), the kernel, each module's
                <module>.platform.ts (its buses and the results, value objects and events they
                answer with), the shared arguments and output, and the
                daemon's client and protocol, to ask the daemon what it alone knows. Never a
                repository, a domain op or an adapter: the composition root provides those.
              external: [effect]
              allow:
                - "@/kernel/**"
                - "@/modules/*/*.platform.ts"
                - "@/interface/cli/**"
                - "@/interface/daemon/*.client.ts"
                - "@/interface/daemon/*.protocol.ts"
                # Where chernabog keeps its files, and which chernabog this is,
                # which a command may say.
                - "@/platform/home.ts"
                - "@/platform/version.ts"
            children:
              # The CLI process's composition root: its commands, the modules'
              # layers, and the commands still written over the legacy tier,
              # each legacy file named until it moves into a module.
              # The CLI process's composition root: its commands, the modules'
              # layers, and the commands still written over the legacy tier.
              "main.ts": { use: cli-root }
              "*.arguments.ts": {}
              "*.output.ts": {}
              # The questions the wizards ask between a plan and its apply.
              "*.prompt.ts": {}
              "{module}/":
                children:
                  "*.command.ts": {}
                  "*.output.ts": {}
                  # A command that composes the runtime itself: the foreground
                  # run, the hybrid path's start and open-pr, doctor.
                  "*.main.ts": { use: cli-root }

          "tui/":
            message: >-
              tui/ is the live view chernabog opens in a terminal: the daemon's status, drawn
              with @opentui, and the settings a person changes from it.
            imports:
              reset: true
              message: >-
                The TUI asks the daemon over its client, dispatches the modules' queries and
                commands, and draws with @opentui. It names the kernel, the platform, each
                module's <module>.platform.ts (its buses and the value objects and events they
                answer with), and the legacy files it still reads, each named here until a module
                owns it.
              external: [effect, "@opentui/core"]
              allow:
                - "@/kernel/**"
                - "@/platform/**"
                - "@/interface/tui/**"
                - "@/interface/daemon/*.client.ts"
                - "@/interface/daemon/*.protocol.ts"
                - "@/modules/*/*.platform.ts"
                - "@/repo-config.ts"
            children:
              "*.ts": {}

          "daemon/":
            message: >-
              daemon/ is the daemon's adapter: the protocol it speaks over its local socket
              (*.protocol.ts), and the client the CLI and TUI ask it with (*.client.ts).
            imports:
              reset: true
              message: >-
                The daemon's protocol is made of the modules' results, and its client reaches the
                socket in the chernabog home. They name effect, the value objects and events the
                modules answer with, through each module's <module>.platform.ts, and home.ts for
                the home's paths.
              external: [effect]
              allow:
                - "@/modules/*/*.platform.ts"
                - "@/interface/daemon/**"
                - "@/platform/home.ts"
            children:
              "*.protocol.ts": {}
              "*.client.ts": {}
              # The daemon process: its schedules, its socket and the engine it
              # drives, still over the legacy runtime, each file named here.
              "*.server.ts":
                imports:
                  reset: true
                  message: >-
                    The daemon dispatches the modules' commands and queries on a schedule and over
                    its socket. It names effect and Bun's HTTP server, the kernel, the platform,
                    its own protocol, each module's <module>.platform.ts (its buses, layers and
                    value objects, and the runtime the runs module still publishes there), and
                    the legacy files it still reads, each named here until a module owns it.
                  external: [effect, "@effect/platform-bun"]
                  allow:
                    - "@/kernel/**"
                    - "@/platform/**"
                    - "@/interface/daemon/**"
                    - "@/interface/application-modules.ts"
                    - "@/modules/*/*.platform.ts"
                    - "~/core/src/**"
                    - "@/repo-config.ts"

      "kernel/":
        message: >-
          kernel/ holds the domain primitives every module shares: branded ids (*.id.ts), value
          objects (*.value-object.ts), the errors they raise (*.errors.ts) and the
          specification kit (specification.ts). Anything one module owns belongs in that
          module's domain/.
        name: kebab-case
        # A primitive every module's domain shares talks no more than the domain does.
        members: [{ use: no-talking }]
        imports:
          reset: true
          message: >-
            The kernel is the bottom of the domain: it names effect and itself, nothing else.
          external: [effect]
          allow: ["@/kernel/**"]
        children:
          "*.id.ts": {}
          "*.value-object.ts": {}
          "*.errors.ts": {}
          # The specification kit every aggregate's predicates are built with.
          "specification.ts": {}
          "*.test.ts":
            surface: [{ use: test-exports-nothing }]
            imports:
              message: >-
                A kernel test names the kernel and effect.
              external: [effect]
              allow: []

      "modules/{module}/":
        message: >-
          A module admits domain/ (its aggregates, their ops and errors, its domain services and
          its ports), commands/ and queries/ (what the adapters dispatch), infrastructure/ (the
          adapters behind its ports), one <module>.module.ts that wires the module (ADR 12),
          <module>.command-handlers.ts and <module>.query-handlers.ts, its slice of the buses,
          <module>.event-span-attributes.ts, what its spans say about the messages and events
          they carry, <module>.platform.ts, the one surface it publishes to the composition
          roots, and, when another module asks it or it asks another, <module>.exports.ts and
          <module>.imports.ts.
        name: kebab-case
        # A module is private except for what it publishes on purpose
        # (docs/adr/0007-module-gateways.md).
        importedBy:
          message: >-
            Code outside src/modules/ names a module only through its <module>.platform.ts. A
            module is private except for what it publishes on purpose: reaching past that file
            couples you to a shape the module is free to change. Re-export what you need from
            the platform surface instead.
          allow:
            - "@/modules/**"
            - "**/*.test.ts"
            - "test/**"
            # The legacy tier's repo settings, which the modules' repositories and
            # runtime still read, so it can't name their platform surfaces without a
            # cycle. It leaves when it moves into the enrollment module (ADR 2).
            - "@/repo-config.ts"
          # The platform surface is itself public, so the restriction does not cover it.
          matchNot: ["*.platform.ts"]
        imports:
          message: >-
            A module's platform surface re-exports its own module and nothing else; every other
            file in it states its own allowlist below. The prohibition here holds for all of
            them.
          allow: ["@/modules/{module}/**"]
          deny:
            # Module-wide, so it holds for every tier below, whatever its allowlist.
            - match: "@/modules/*/**"
              matchNot:
                - "@/modules/{module}/**"
                - "@/modules/*/*.exports.ts"
                - "@/modules/*/*.module.ts"
              message: >-
                A module names another only through that module's <module>.exports.ts, the
                grants it publishes to its peers, and only from its own <module>.imports.ts
                (docs/adr/0009-modules-import-and-export.md), or, from its own <module>.module.ts,
                that module's <module>.module.ts, to wire it (ADR 12). Reaching anywhere else
                couples you to a shape the other module is free to change. Ask through a port of
                your own in domain/ports/acl/, whose adapter dispatches the query the other module
                grants.
        children:
          # The platform surface: what the composition roots and the inbound
          # adapters name to assemble and drive the module. It only re-exports.
          "*.platform.ts":
            name: { like: "{module}" }
            importedBy:
              message: >-
                <module>.platform.ts is the PLATFORM surface: what the composition roots and the
                inbound adapters they run (src/interface/) name to assemble and drive this
                module. Another module never names it; a peer's vocabulary comes through
                <module>.exports.ts when the first one needs it.
              allow:
                - "@/interface/**"
                - "**/*.test.ts"
                - "test/**"
            surface:
              - message: >-
                  <module>.platform.ts re-exports; `{name}` is declared here. It is the surface
                  the module publishes to the platform, not a home for code: move the
                  declaration into the stereotype folder that owns it and re-export it from
                  there.
                reexport: false
            # Inherits the module's own allowlist: its own module and nothing else.
            imports:
              message: >-
                <module>.platform.ts re-exports from its own module and nowhere else: its
                dispatchers, message results, domain value objects and events, and its Layers.
                Anything it names becomes public.
              allow: []
              deny:
                - match: ["@/modules/*/infrastructure/**", "@/modules/*/interface/**"]
                  # The one publishable adapter: a third-party client's live/fake
                  # pair, which a composition root picks between. And, for now,
                  # the runs module's runtime, which the roots still compose
                  # directly until it finishes moving behind the module's
                  # commands, queries and Layers.
                  matchNot:
                    - "@/modules/*/infrastructure/clients/*.client-live.ts"
                    - "@/modules/*/infrastructure/clients/*.client-fake.ts"
                    - "@/modules/runs/infrastructure/runtime/**"
                  message: >-
                    <module>.platform.ts publishes the module's dispatchers, results, value
                    objects, events and Layers, never its adapters, with one exception: a
                    third-party client's live/fake pair, because choosing between those is a
                    composition root's job. Re-exporting anything else from infrastructure/ or
                    interface/ makes an adapter part of the module's public surface.

          # The PEER surface: what another module may ask of this one, each grant
          # a subset of its messages (docs/adr/0009-modules-import-and-export.md).
          "*.exports.ts":
            name: { like: "{module}" }
            importedBy:
              message: >-
                <module>.exports.ts is the PEER surface: the messages another module is granted.
                Only a peer's <module>.imports.ts names it, and the test harness that stages this
                module for a peer's ACL adapter. Everywhere else in a consumer asks through a port
                of its own in domain/ports/acl/, whose adapter is the one place this vocabulary
                appears.
              allow:
                - "@/modules/*/*.imports.ts"
                - "**/*.test.ts"
                - "test/*.ts"
            imports:
              message: >-
                <module>.exports.ts carves its grants from its own module's message groups with the
                CQRS library's subsetOf, and names nothing else.
              external: ["@effect-server-utils/cqrs"]
            surface:
              - message: >-
                  What the peer surface declares is named
                  `<module>Access<Queries|Commands|DomainEvents|Errors>`; `{name}` is not. One
                  shape across every module, so a consumer's import line says which module it
                  reaches and whether it is asking or telling.
                kinds: [named]
                reexport: false
                convention:
                  { regex: "^[a-z][a-zA-Z0-9]*Access(Queries|Commands|DomainEvents|Errors)$" }
                probe:
                  source: "export const zzPeerQueries = 1;"
              - message: >-
                  <module>.exports.ts declares its grants; `{name}` is a bare re-export, which
                  publishes whatever the origin file exports, under whatever name it uses, and
                  slips past the naming rule above. Carve it into the <module>Access<...> grant
                  with Query.subsetOf or Command.subsetOf, so a peer's dispatcher demands only
                  those tags.
                kinds: [named]
                reexport: true
                probe:
                  source: 'export { ZzThing } from "./zz.ts";'

          # The inbound gateway, mirroring the peer surface: what this module
          # takes from others, and the one file here that names another module.
          "*.imports.ts":
            name: { like: "{module}" }
            imports:
              reset: true
              message: >-
                <module>.imports.ts names other modules' <module>.exports.ts and nothing else: it
                is this module's inventory of what it takes from them, and the one file here
                allowed to name them.
              allow: ["@/modules/*/*.exports.ts"]
            importedBy:
              message: >-
                <module>.imports.ts is read by this module's ACL adapters (infrastructure/acl/),
                the one place another module's vocabulary appears. A handler asks the ACL port
                instead; another module reaching for this file would depend on a third module
                through this one.
              allow:
                - "@/modules/*/infrastructure/acl/*.acl-live.ts"
                - "**/*.test.ts"

          # The module's slice of each bus: its messages grouped, each mapped to
          # its handler, and the dispatcher service the adapters ask, as the
          # hexagon's <module>.command-handlers.ts does. What the handlers need is
          # the module's wiring's to provide.
          "*.command-handlers.ts | *.query-handlers.ts":
            name: { like: "{module}" }
            imports:
              reset: true
              message: >-
                A module's handler map binds its messages to their handlers on the bus, and
                provides them nothing: <module>.module.ts provides the live adapters they need. It
                pins its dispatcher to the unit of work it is built beside. It names its own
                module, effect, the CQRS and unit-of-work libraries, and the platform's unit of
                work.
              external: [effect, "@effect-server-utils/cqrs", "@effect-server-utils/unit-of-work"]
              allow: ["@/modules/{module}/**", "@/platform/unit-of-work.ts"]

          # The span attribute extractors the module's dispatchers and event
          # bus are built with, keyed by message and event tag.
          "*.event-span-attributes.ts":
            name: { like: "{module}" }
            imports:
              reset: true
              message: >-
                A module's span attributes read its messages and events: they name its own
                module's domain, the kernel and the CQRS library's Event.spanAttributes.
              external: ["@effect-server-utils/cqrs"]
              allow: ["@/kernel/**", "@/modules/{module}/domain/**"]
          "*.event-span-attributes.test.ts": { use: module-test-file }

          # The wiring plane (ADR 12): the module assembled, as a record of Layers.
          # It provides the modules it needs with Layer.provide, which keeps
          # them a private import; Layer.provideMerge would re-export them.
          # Enrollment's provides recipes', beneath the ACL adapter that asks it.
          "*.module.ts":
            name: { like: "{module}" }
            imports:
              reset: true
              message: >-
                <module>.module.ts wires the module: it provides its handler maps with the live
                adapters they need, and provides each module it needs by that module's
                <module>.module.ts, the wiring plane talking to the wiring plane. It names its
                own module, effect to merge them, and the platform. A peer's vocabulary is not
                wiring, and does not belong here.
              external: [effect]
              allow: ["@/modules/{module}/**", "@/modules/*/*.module.ts", "@/platform/**"]
            importedBy:
              message: >-
                <module>.module.ts is the WIRING plane: it holds the module's Layers, and only
                other wiring needs them. Another module's <module>.module.ts may name it, to
                provide a module it needs, and its own <module>.platform.ts publishes it to the
                composition roots, which merge it through src/interface/application-modules.ts.
                A command, a query, a handler map or an adapter asks a dispatcher instead.
              # Its own platform surface: a peer's names only its own module.
              allow:
                - "@/modules/*/*.module.ts"
                - "@/modules/*/*.platform.ts"
                - "**/*.test.ts"

          "domain/":
            message: >-
              domain/ is a container: one folder per aggregate (named for it), holding its
              repository port beside it, domain-services/ for domain logic no single aggregate
              owns, and ports/ for the clients the handlers depend on. No files live directly in
              domain/.
            members: [{ use: no-talking }]
            imports:
              reset: true
              message: >-
                The domain names effect, the kernel and its own module's domain. No YAML, no SQL,
                no process, no platform adapter, no other module: those are adapters, wired
                against the domain's ports.
              external: [effect]
              allow: ["@/kernel/**", "@/modules/{module}/domain/**"]
            children:
              "ports/":
                message: >-
                  domain/ports/ is a container: clients/ (third-party systems such as gh, git or
                  launchd) and acl/ (another module this one asks). A repository port lives
                  beside its aggregate, in domain/<aggregate>/.
                children:
                  "acl/":
                    message: >-
                      domain/ports/acl/ holds one *.acl.ts per question this module asks another,
                      in this module's own words (docs/adr/0009-modules-import-and-export.md).
                    children:
                      "*.acl.ts":
                        message: >-
                          An ACL port needs its live adapter, its fake and the live adapter's
                          test in ../../../infrastructure/acl/.
                        surface: [{ use: port-declares-no-value }]
                        requires:
                          - "../../../infrastructure/acl/{base}-live.ts"
                          - "../../../infrastructure/acl/{base}-fake.ts"
                          - "../../../infrastructure/acl/{base}-live.test.ts"
                        importedBy: { use: acl-port-consumers }
                  "clients/":
                    children:
                      "*.client.ts":
                        message: >-
                          A client port needs its live adapter, its fake and the live adapter's
                          test in ../../../infrastructure/clients/.
                        surface: [{ use: port-declares-no-value }]
                        requires:
                          - "../../../infrastructure/clients/{base}-live.ts"
                          - "../../../infrastructure/clients/{base}-fake.ts"
                          - "../../../infrastructure/clients/{base}-live.test.ts"
                        importedBy: { use: port-consumers }

              # Pure free-function bags for domain logic no single aggregate owns
              # (the hexagon's ADR-0023): the one domain folder meant to compose
              # several aggregates. Logic an aggregate owns stays on its ops.
              "domain-services/":
                message: >-
                  domain/domain-services/ holds *.domain-service.ts files and their tests:
                  stateless domain logic that no single aggregate owns, such as routing a
                  trigger's items before any run exists. It is a pure free-function bag (like
                  XRootOps, no Context.Service). Logic that reads or changes one aggregate
                  belongs on that aggregate's *.root-ops.ts.
                children:
                  "*.domain-service.ts":
                    message: >-
                      A domain service is real domain logic, so it needs a sibling
                      *.domain-service.test.ts.
                    requires: ["{base}.test.ts"]
                  "*.test.ts": { use: unit-test-file }

              # One folder per aggregate. ports/ and domain-services/ above are
              # matched first, so this catch-all is only ever an aggregate.
              "{aggregate}/":
                message: >-
                  An aggregate's folder admits its root (*.root.ts, a Schema.Class value), its
                  operations (*.root-ops.ts, pure functions returning Result), its entities
                  (*.entity.ts, parts with an identity of their own), its constituent aggregates
                  (*.aggregate.ts, parts that gather value objects but are not a consistency
                  boundary) and their operations (*.aggregate-ops.ts), its id (*.id.ts), its value
                  objects (*.value-object.ts), its errors (*.errors.ts), its domain events
                  (*.events.ts, the Schemas its commands dispatch), its specifications
                  (*.specification.ts, the predicates it is read by) and its repository port
                  (*.repository.ts). A free-standing helper is an op that hasn't found its root,
                  or a domain service.
                imports:
                  message: >-
                    An aggregate sees itself, the kernel and effect. It does not reach another
                    aggregate or the ports: composing aggregates is a handler's job.
                  allow: ["@/modules/{module}/domain/{aggregate}/**"]
                children:
                  # The folder is the aggregate, so its root carries the folder's name.
                  "*.root.ts":
                    name: { like: "{aggregate}" }
                    surface: [{ use: root-exports }]
                  "*.root-ops.ts":
                    name: { like: "{aggregate}" }
                    surface: [{ use: root-ops-exports }]
                    message: >-
                      An aggregate's operations own its invariants, so they carry the test
                      obligation: add the sibling *.root-ops.test.ts.
                    requires: ["{base}.test.ts"]
                    importedBy:
                      message: >-
                        *.root-ops.ts is the aggregate's mutation surface. Only its module's
                        domain, its commands and queries (which ask its predicates),
                        its repository fakes and tests may call it; an adapter reaching for an op
                        is bypassing the command that should own the change.
                      allow:
                        - "@/modules/*/domain/**"
                        - "@/modules/*/commands/**"
                        - "@/modules/*/queries/**"
                        - "**/*.repository-fake.ts"
                        - "**/*.test.ts"
                  "*.entity.ts":
                    surface: [{ use: entity-exports }]
                  "*.aggregate.ts": {}
                  "*.aggregate-ops.ts":
                    use: constituent-ops
                    surface: [{ use: aggregate-ops-exports }]
                  "*.id.ts":
                    surface: [{ use: id-exports }]
                  "*.value-object.ts": {}
                  "*.errors.ts": {}
                  "*.events.ts": {}
                  "*.specification.ts": { use: specification }
                  "*.repository.ts":
                    message: >-
                      A repository port needs its live adapter, its fake and the live adapter's
                      test in ../../infrastructure/repositories/.
                    surface: [{ use: port-declares-no-value }]
                    requires:
                      - "../../infrastructure/repositories/{base}-live.ts"
                      - "../../infrastructure/repositories/{base}-fake.ts"
                      - "../../infrastructure/repositories/{base}-live.test.ts"
                    importedBy: { use: port-consumers }
                    # A repository stores aggregates and reads them back; what they mean is
                    # the domain's (docs/adr/0008-repository-vocabulary-and-specifications.md).
                    # Both halves of the persistence vocabulary, each with the advice that
                    # fits its half. The probes are written as an intersection, whose own
                    # members the rule must still read under the alias's name.
                    members:
                      - message: >-
                          Repository port method "{name}" is not in the persistence vocabulary
                          (ADR 8). A read is only findOne/findMany taking a Specification: turn
                          this lookup or variant into a Specification the caller composes (e.g.
                          repo.findOne(RunSpecifications.withId(id))), so the rule lives in one
                          place and the fake filters with the same object the live adapter
                          does. There are no keyed or variant finders.
                        subject: members
                        declares: [type, interface]
                        in: "*Repository*"
                        match: "find*"
                        allow: [findOne, findMany]
                        probe:
                          source: "export type ZzRepositoryService = ZzBase & { readonly findOneByRepo: () => void };"
                          name: findOneByRepo
                      - message: >-
                          Repository port method "{name}" is not in the persistence vocabulary
                          (ADR 8). It reads like a domain verb: put that behaviour on the
                          aggregate's ops and have the handler store the result. A port declares
                          only insertOne/insertMany, updateOne/updateMany, deleteOne/deleteMany,
                          upsertOne/upsertMany, and findOne/findMany.
                        subject: members
                        declares: [type, interface]
                        in: "*Repository*"
                        matchNot: "find*"
                        allow:
                          - insertOne
                          - insertMany
                          - updateOne
                          - updateMany
                          - deleteOne
                          - deleteMany
                          - upsertOne
                          - upsertMany
                        probe:
                          source: "export type ZzRepositoryService = ZzBase & { readonly pausedSlugs: () => void };"
                          name: pausedSlugs
                  "*.test.ts": { use: unit-test-file }

          "commands/":
            message: >-
              commands/ holds, per thing an adapter can ask the module to change, a
              <verb-noun>.command.ts declaring the message (Command.make: payload, success,
              failure) and a <verb-noun>.handler.ts carrying it out, and their tests. A shared
              helper here is an aggregate op or a port that hasn't been written yet.
            members: [{ use: no-talking }]
            imports:
              reset: true
              message: >-
                A command names effect, the CQRS and unit-of-work libraries, the kernel, its own
                module's domain (aggregates and ports) and its sibling commands. Never a query
                (what two do together, the adapter that dispatches them composes),
                never infrastructure (adapters are provided by the handler map), never
                interface/, never another module's internals.
              external: [effect, "@effect-server-utils/cqrs", "@effect-server-utils/unit-of-work"]
              allow:
                - "@/kernel/**"
                - "@/modules/{module}/domain/**"
                - "@/modules/{module}/commands/**"
            children:
              "*.command.ts": {}
              "*.handler.ts":
                message: >-
                  A command handler owes a sibling *.handler.test.ts, run over its ports' fakes.
                requires: ["{base}.test.ts"]
                surface: [{ use: one-handler-export }, { use: camel-case-value-exports }]
              "*.test.ts": { use: module-test-file }

          "queries/":
            message: >-
              queries/ holds, per thing an adapter can ask the module to tell it, a
              <verb-noun>.query.ts declaring the message (Query.make: payload, success, failure)
              and a <verb-noun>.handler.ts answering it, and their tests.
            members: [{ use: no-talking }]
            imports:
              reset: true
              message: >-
                A query reads its storage directly and answers with a read model it owns
                (docs/adr/0011-queries-read-their-storage.md). It names effect (its FileSystem
                among it), the CQRS library, the kernel, its sibling queries, its module's
                storage/ (the file and row schemas it shares with the repositories), where
                chernabog keeps its files (@/platform/home.ts), and its module's domain: its
                branded ids and its client ports, and, until the `read-models` campaign is
                done, the rest, which that campaign counts. It names yaml to read a YAML file
                it reads directly. Never a command, never infrastructure, never interface/,
                never another module's internals.
              external: [effect, "@effect-server-utils/cqrs", yaml]
              allow:
                - "@/kernel/**"
                - "@/modules/{module}/domain/**"
                - "@/modules/{module}/queries/**"
                - "@/modules/{module}/storage/**"
                - "@/platform/home.ts"
            children:
              "*.query.ts": {}
              "*.handler.ts":
                message: >-
                  A query handler owes a sibling *.handler.integration.test.ts, run over real
                  storage: a query reads what its repositories keep.
                requires: ["{base}.integration.test.ts"]
                surface: [{ use: one-handler-export }, { use: camel-case-value-exports }]
              "*.integration.test.ts": { use: query-integration-test-file }

          # How the module's stores keep things on disk, which its repositories
          # write and its queries read directly: the hexagon's RowSchemas
          # (docs/adr/0011-queries-read-their-storage.md). Only the format is
          # shared; each side maps it to its own model.
          "storage/":
            message: >-
              storage/ holds the module's storage formats, one <name>.schema.ts per file or table
              its repositories write: the Schema of its rows or its document, and nothing else.
              Turning one into an aggregate is the repository's mapper's job, and into a read
              model the query's.
            imports:
              reset: true
              message: >-
                A storage format is a Schema over what's on disk: it names effect, never the
                domain, whose meaning it doesn't carry.
              external: [effect]
              allow: []
            importedBy:
              message: >-
                A storage format is shared by the module's repositories, which write it, and its
                queries, which read it directly. Anything else reads the module through a query.
              allow:
                - "@/modules/*/infrastructure/repositories/**"
                - "@/modules/*/queries/**"
            children:
              "*.schema.ts": {}

          "infrastructure/":
            message: >-
              infrastructure/ is a container: repositories/ (behind the aggregates' repository
              ports), clients/ (behind domain/ports/clients/) and acl/ (behind
              domain/ports/acl/). No files live directly in infrastructure/.
            imports:
              reset: true
              message: >-
                An adapter implements one of its module's ports. It names its module's domain,
                the kernel and its sibling adapters; each bucket below adds the third-party
                packages it adapts.
              external: [effect]
              allow:
                - "@/kernel/**"
                - "@/modules/{module}/domain/**"
                - "@/modules/{module}/infrastructure/**"
            children:
              # The anti-corruption seam: the one place another module's
              # vocabulary appears (docs/adr/0009-modules-import-and-export.md).
              "acl/":
                imports:
                  reset: true
                  message: >-
                    An ACL adapter answers its module's ACL port by dispatching the query another
                    module grants, taken from this module's own <module>.imports.ts, and
                    translates the answer into the port's types: this module's value objects and
                    errors. It names nothing else: no repository, no client, no handler, and no
                    other module directly.
                  external: [effect, "@effect-server-utils/cqrs"]
                  allow:
                    - "@/modules/{module}/*.imports.ts"
                    - "@/modules/{module}/domain/ports/acl/**"
                    - "@/modules/{module}/domain/*/*.value-object.ts"
                    - "@/modules/{module}/domain/*/*.errors.ts"
                children:
                  "*.acl-live.ts": {}
                  "*.acl-fake.ts": {}
                  "*.test.ts": { use: acl-test-file }
              "repositories/":
                imports:
                  message: >-
                    A repository adapts the module's aggregates to their storage: YAML for
                    machine config, JSON for runtime state. Until the machine
                    module owns machine config, a repository reads and edits it through the
                    legacy machinery in config.ts and repo-config.ts, and nothing else of the
                    legacy tier. state.db's transaction driver adapts the unit-of-work library's
                    port to the SQL client the stores share.
                  external: [yaml, "@effect-server-utils/unit-of-work"]
                  allow: ["@/platform/**", "@/repo-config.ts", "@/modules/{module}/storage/**"]
                children:
                  "*.repository-live.ts": { members: [{ use: no-in-place-writes }] }
                  "*.repository-fake.ts": { members: [{ use: no-in-place-writes }] }
                  "*.mapper.ts": { members: [{ use: no-in-place-writes }] }
                  # The transaction a command's unit of work opens in the stores' database.
                  "*.transaction-driver-live.ts": {}
                  "*.transaction-driver-live.test.ts": { use: transaction-driver-test-file }
                  "*.repository-live.test.ts": { use: adapter-test-file }
                  "*.mapper.test.ts": { use: mapper-test-file }
                  # What a SQLite repository's reads compile their specification with.
                  "criteria-to-sql.ts": {}
                  "criteria-to-sql.test.ts": { use: adapter-test-file }
              # The runtime a run's flow executes in: the workflow engine and the
              # step runner, the SDK's services over GitHub, git, worktrees and
              # usage, and the agents and launchers sessions run in. Adapters
              # of the SDK's ports, being split into the module's own.
              "runtime/":
                imports:
                  message: >-
                    The runtime adapts the published SDK's services to the machine and reports a
                    run's steps, waits, markers and subjects back through its module's commands, and
                    asks after a run through its module's queries, as an inbound adapter would. It names the
                    SDK, the platform, its module, and the legacy files that load a repo's config
                    and flows (config.ts, repo-config.ts, loader.ts), until those move. Nothing
                    of the interface or another module.
                  external: ["@effect/sql-sqlite-bun"]
                  allow:
                    - "node:**"
                    - "~/core/src/**"
                    - "@/platform/**"
                    - "@/modules/{module}/*.query-handlers.ts"
                    - "@/modules/{module}/*.command-handlers.ts"
                    - "@/repo-config.ts"
                    - "test/*.ts"
                children:
                  "*.ts": {}
                  "agents/":
                    children:
                      "*.ts": {}
                  "launchers/":
                    children:
                      "*.ts": {}
              "clients/":
                imports:
                  message: >-
                    A client adapts a third-party system (gh, git, launchd, an agent CLI, the
                    files the engine writes) to the module's client port. It reaches the machine
                    through the platform adapters (commands, GitHub, the home, this program),
                    and, until each moves into its module, the legacy machinery it wraps:
                    snapshot.ts's git helpers, config.ts, loader.ts for a checkout's flows,
                    repo-config.ts for the team's config, and templates.ts and flow-deps.ts for
                    what this binary bundles. It names the published SDK whose flows it runs.
                    Nothing else of the legacy tier.
                  allow:
                    - "@/platform/**"
                    - "@/repo-config.ts"
                    - "~/core/src/**"
                children:
                  "*.client-live.ts": {}
                  "*.client-fake.ts": {}
                  "*.test.ts":
                    surface: [{ use: test-exports-nothing }]
                    imports:
                      reset: true
                      message: >-
                        A client's live test drives the real system the client wraps (git in a
                        scratch repo, say), so it names the platform's exec and GitHub API and
                        Bun's platform services beside what a module test may.
                      external: [effect, "@effect/platform-bun"]
                      allow:
                        [
                          "@/kernel/**",
                          "@/modules/{module}/**",
                          "@/platform/exec.ts",
                          "@/platform/github-api.ts",
                          "@/platform/home.ts",
                          "~/core/src/**",
                          "test/*.ts",
                        ]
      "*.test.ts":
        surface: [{ use: test-exports-nothing }]

  "~/core/src/":
    message: >-
      The published @chernabog/core: the contract between the binary and every repo's flows. The
      flow shape, the hooks the daemon calls, the durable primitives, the typed errors, the
      service ports, and the conventions the daemon itself acts on (claims, markers). The binary
      bundles it and provides its own copy to every flow; within a major it only grows
      (docs/adr/0004-core-abi.md).
    imports:
      reset: true
      message: >-
        Core is the contract the SDK's blocks are written against, so it names effect and itself:
        never a block, never the daemon.
      external: [effect]
      allow: ["~/core/src/**"]
    surface:
      - use: no-default-exports
    children:
      "*.ts": {}

  "~/sdk/src/":
    message: >-
      The published @chernabog/sdk: the blocks a recipe is written from (Implement, Review, Plan,
      Hybrid, PullRequest, prompts), over core's ports, and core re-exported, so a flow imports
      from one package. Each repo installs the version it pins.
    imports:
      reset: true
      message: >-
        A block reaches the daemon only through core's ports, and core only through its entry,
        as an installed SDK resolves it: so it names effect, node, core's entry and other blocks.
      external: [effect]
      allow: ["node:**", "~/core/src/index.ts", "~/sdk/src/**"]
    surface:
      - use: no-default-exports
    children:
      "*.ts": {}

  "~/recipes/":
    message: >-
      The published @chernabog/recipes: the recipes a repo copies into its .chernabog/ or imports
      from it, in the recipe package format (its package.json's `chernabog.recipes`).
    layout: open
    imports:
      reset: true
      message: >-
        A recipe is a person's flow, copied or imported: it names the published SDK and effect,
        and nothing of the daemon's.
      external: [effect]
      allow: ["~/sdk/**"]
    children:
      # One flow per recipe, named for it, and the prompts the flows render.
      "flows/":
        children:
          "*.ts":
            surface: [{ use: flow-exports-only-itself }, { use: no-star-exports }]
      "prompts/":
        children:
          "*.md": {}

  "test/":
    message: >-
      test/ holds the unit and engine tests, the harnesses they share (fakes, scripted askers,
      fixtures), the acceptance tier that drives the built CLI, and its fake binaries.
    layout: open
    imports:
      reset: true
      message: >-
        A test names the code under test, its harnesses, the SDK, effect and the runtime it
        drives — nothing else.
      external:
        - effect
        - effect-bun-test
        - "@effect/platform-bun"
        - "@effect/sql-sqlite-bun"
        - "@effect-server-utils/cqrs"
        - "@effect-server-utils/unit-of-work"
        - yaml
      allow: ["node:**", "@/**", "~/core/**", "~/sdk/**", "~/recipes/**", "test/**", "scripts/**"]
    children:
      "acceptance/": { layout: open }
      "fakebin/": { layout: open }
      "*.test.ts":
        surface: [{ use: test-exports-nothing }]

  "scripts/":
    message: >-
      scripts/ holds the generators, release helpers and CI's coverage summary, run with
      `bun scripts/<name>.ts`.
    layout: open
    imports:
      reset: true
      message: >-
        A script generates or packages the daemon's sources; it names effect, node and the files
        it reads.
      external: [effect, "@effect/platform-bun"]
      allow: ["node:**", "scripts/**", "~/sdk/**"]
    surface:
      - use: no-default-exports
      - use: no-star-exports
    children:
      # What a script renders, which a test renders again; the script prints or writes it.
      "templates.ts": { members: [{ use: no-talking }] }
      "core-api.ts": { members: [{ use: no-talking }] }
      "coverage.ts": { members: [{ use: no-talking }] }
      # What release-please would release from its PR, read with release-please's own
      # parser, the version its action bundles, since that parser is what goes wrong.
      "release-pr.ts":
        members: [{ use: no-talking }]
        imports:
          message: >-
            The release PR check reads the PR's body with release-please's parser, and names
            effect beside it.
          external: [release-please]

# The moves the policy above has not finished making, each counted and held:
# a ledger under .architecture-campaigns/ lists what is left, and only shrinks.
# `bun run architecture:clear` records a change's progress in it, in the same
# commit; `check` fails until it has.
campaigns:
  repo-config:
    title: Modules stop sharing repo-config.ts
    why: >-
      The legacy src/repo-config.ts reads and edits machine config and a repo's team config for
      whoever asks, so the modules couple through it as through a shared database no one owns.
      Each part has an owner (docs/adr/0009-modules-import-and-export.md): enrolled repos and
      their per-persona choices are enrollment's, the machine's personas and accounts are
      machine's, and the team's .chernabog/config.yaml is recipes'. Another module asks an owner
      only through an ACL port of its own.
    how: >-
      Give the file's need an owner. A module's own config moves into its own repository. What
      it reads of another module's becomes a port in its domain/ports/acl/, whose live adapter in
      infrastructure/acl/ dispatches the query the owner grants in its <module>.exports.ts (taken
      through the consumer's <module>.imports.ts) and translates the answer into the consumer's
      types. A composition root dispatches the owner's queries itself. Then drop the import and
      run `bun run architecture:clear`; when none is left, delete src/repo-config.ts, its
      baseline entry and every allowance naming it.
    owner: "@zacharyweidenbach"
    scope: ["src/**"]
    onTouch: ratchet
    staleAfter: 14d
    phases:
      - id: owners
        intent: >-
          Each file that imports src/repo-config.ts stops: its module's own config moves into its
          repository, another module's comes through an ACL port, and a root asks the owner's
          queries. A consumer or two per pull request.
        objectives: [repo-config-imports]

    objectives:
      repo-config-imports:
        intent: A file that imports repo-config.ts couples to every module's config through it.
        holdout: file
        match:
          imports:
            resolves: "@/repo-config.ts"
        probes:
          fires:
            - path: src/modules/runs/infrastructure/runtime/labels.ts
              source: 'import { flowSettingsInput } from "../../../../repo-config.ts";'
              edges:
                "../../../../repo-config.ts": src/repo-config.ts
          ignores:
            - path: src/modules/enrollment/infrastructure/acl/team-flows.acl-live.ts
              source: 'import { recipesAccessQueries } from "../../enrollment.imports.ts";'
              edges:
                "../../enrollment.imports.ts": src/modules/enrollment/enrollment.imports.ts

  read-models:
    title: Queries read their storage directly and never reach the domain
    why: >-
      A query that reads through a repository and asks a root's ops is bound to the write model:
      every change to an aggregate ripples into what the CLI, the TUI and the daemon show, and a
      read can't be shaped for the one who asks without reshaping the aggregate. A query reads its
      storage itself and answers with a read model it owns, as queries-isolation holds in
      dataquail/functional-domain-driven-hexagon (docs/adr/0011-queries-read-their-storage.md).
    how: >-
      Have the handler read the file with effect's FileSystem (and yaml for machine config) or, in
      runs, state.db with SQL, decoding it with the Schema in the module's storage/ that its
      repository writes with. Move the view it answers with, and its read-side errors, into its
      *.query.ts; express any rule it asked a root's ops over the read model, or reclassify it as
      ADR 11 records. Keep its integration test unchanged, then run `bun run architecture:clear`.
    owner: "@zacharyweidenbach"
    scope: ["src/modules/**"]
    perimeter: { glob: "src/modules/*/" }
    onTouch: ratchet
    staleAfter: 14d
    phases:
      - id: isolate
        intent: >-
          Each query stops naming its module's roots, ops, repositories, specifications, value
          objects, errors and events. A module or a handful of queries per pull request; when the
          ledger is empty, the queries' allowlist drops the domain but for ids and client ports,
          and port-consumers and root-ops' importedBy drop queries/.
        objectives: [queries-reach-domain]

    objectives:
      queries-reach-domain:
        intent: >-
          A query that names the write model reads through it, so the aggregate's shape is what
          every reader sees.
        holdout: file
        match:
          all:
            - path: { file: "/queries/[^/]*\\.ts$" }
            - not:
                path: { file: "\\.test\\.ts$" }
            - any:
                - imports: { resolves: "@/modules/*/domain/*/*.root.ts" }
                - imports: { resolves: "@/modules/*/domain/*/*.root-ops.ts" }
                - imports: { resolves: "@/modules/*/domain/*/*.repository.ts" }
                - imports: { resolves: "@/modules/*/domain/*/*.specification.ts" }
                - imports: { resolves: "@/modules/*/domain/*/*.value-object.ts" }
                - imports: { resolves: "@/modules/*/domain/*/*.errors.ts" }
                - imports: { resolves: "@/modules/*/domain/*/*.events.ts" }
        probes:
          fires:
            - path: src/modules/trust/queries/find-trusted-tree.handler.ts
              source: 'import { TrustRecordsRepository } from "../domain/trust-record/trust-records.repository.ts";'
              edges:
                "../domain/trust-record/trust-records.repository.ts": "src/modules/trust/domain/trust-record/trust-records.repository.ts"
            - path: src/modules/runs/queries/list-recent-runs.query.ts
              source: 'import { RunView } from "../domain/run/run-view.value-object.ts";'
              edges:
                "../domain/run/run-view.value-object.ts": "src/modules/runs/domain/run/run-view.value-object.ts"
            - path: src/modules/runs/queries/resolve-run-id.handler.ts
              source: 'import { RunRootOps } from "../domain/run/run.root-ops.ts";'
              edges:
                "../domain/run/run.root-ops.ts": "src/modules/runs/domain/run/run.root-ops.ts"
          ignores:
            - path: src/modules/trust/queries/check-trust.handler.ts
              source: |-
                import { ConfigTreeClient } from "../domain/ports/clients/config-tree.client.ts";
                import { TrustFile } from "../storage/trust-file.schema.ts";
              edges:
                "../domain/ports/clients/config-tree.client.ts": "src/modules/trust/domain/ports/clients/config-tree.client.ts"
                "../storage/trust-file.schema.ts": "src/modules/trust/storage/trust-file.schema.ts"
            - path: src/modules/runs/queries/find-run.query.ts
              source: 'import { RunId } from "../domain/run/run.id.ts";'
              edges:
                "../domain/run/run.id.ts": "src/modules/runs/domain/run/run.id.ts"
            - path: src/modules/trust/queries/find-trusted-tree.handler.integration.test.ts
              source: 'import { TrustRecordsRepository } from "../domain/trust-record/trust-records.repository.ts";'
              edges:
                "../domain/trust-record/trust-records.repository.ts": "src/modules/trust/domain/trust-record/trust-records.repository.ts"
            - path: src/modules/runs/commands/finish-run.handler.ts
              source: 'import { RunRootOps } from "../domain/run/run.root-ops.ts";'
              edges:
                "../domain/run/run.root-ops.ts": "src/modules/runs/domain/run/run.root-ops.ts"
