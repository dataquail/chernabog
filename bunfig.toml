[test]
# `bun test` measures coverage the same here and in CI. Its totals' floor is
# scripts/coverage.ts's, which CI checks after the tests: Bun's own
# coverageThreshold holds every file to it, not the total.
coverage = true
coverageReporter = ["text", "lcov"]
coveragePathIgnorePatterns = [
  # Tests, and the fakes and helpers they share.
  "test/**",
  "node_modules/**",
  # Generated by scripts/gen-templates.ts and scripts/gen-effect-modules.ts.
  "src/platform/templates.ts",
  "src/platform/effect-modules.ts",
  # Flows the tests write to the OS temp directory and load from there.
  "../**",
]
