name: Release

# Every push to main updates release-please's release PR, which gathers the
# conventional commits since the last release and shows the versions and
# changelogs they make. Merging that PR tags the release and creates the GitHub
# release; the jobs after it build the binaries and publish the SDK, in this
# same run. A dispatch with an existing tag builds and publishes it again, to
# finish a release that failed partway. See RELEASE.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to build and publish again, e.g. v0.4.0 or sdk-v0.1.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      binary-tag: ${{ steps.plan.outputs.binary-tag }}
      sdk-tag: ${{ steps.plan.outputs.sdk-tag }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # An App token rather than GITHUB_TOKEN: a PR opened with GITHUB_TOKEN
      # runs no workflows, so the release PR would never get CI.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: github.event_name == 'push'
        id: app-token
        with:
          app-id: ${{ secrets.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: github.event_name == 'push'
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      # The root package is the binary, tagged v<version>; the SDK is tagged
      # sdk-v<version>. Each output is empty when that half has nothing to ship.
      - id: plan
        env:
          DISPATCHED: ${{ inputs.tag }}
          BINARY_CREATED: ${{ steps.release.outputs.release_created }}
          BINARY_TAG: ${{ steps.release.outputs.tag_name }}
          SDK_CREATED: ${{ steps.release.outputs['packages/sdk--release_created'] }}
          SDK_TAG: ${{ steps.release.outputs['packages/sdk--tag_name'] }}
        run: |
          binary=""
          sdk=""
          [ "$BINARY_CREATED" = "true" ] && binary=$BINARY_TAG
          [ "$SDK_CREATED" = "true" ] && sdk=$SDK_TAG
          case "$DISPATCHED" in
            "") ;;
            v*) binary=$DISPATCHED ;;
            sdk-v*) sdk=$DISPATCHED ;;
            *) echo "::error::$DISPATCHED is neither a chernabog tag (v*) nor an SDK tag (sdk-v*)"; exit 1 ;;
          esac
          echo "binary-tag=$binary" >> "$GITHUB_OUTPUT"
          echo "sdk-tag=$sdk" >> "$GITHUB_OUTPUT"

  # release-please updates package.json but not bun.lock, which records the
  # SDK's version as a workspace package. Refresh it on the release PR's branch
  # so the release commit leaves the lockfile matching. release-please rewrites
  # its branch on every push to main, so this runs after each of those.
  lockfile:
    needs: plan
    if: needs.plan.outputs.pr != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.plan.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --ignore-scripts
      - name: Commit bun.lock when it moved
        run: |
          git diff --quiet bun.lock && exit 0
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "chore: refresh bun.lock for the release" bun.lock
          git push

  # Each platform builds on its own runner: @opentui/core loads a native library
  # from a per-platform optional dependency, and only the host's is installed.
  binaries:
    needs: plan
    if: needs.plan.outputs.binary-tag != ''
    strategy:
      matrix:
        include:
          - { runner: macos-latest, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
          - { runner: ubuntu-latest, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ needs.plan.outputs.binary-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Check the binary reports the tagged version
        run: |
          reported=$(dist/chernabog --version)
          [ "$reported" = "chernabog $TAG" ] || { echo "::error::the $TAG build reports \"$reported\""; exit 1; }
      - run: tar -czf "chernabog-$TAG-${{ matrix.target }}.tar.gz" -C dist chernabog
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chernabog-${{ matrix.target }}
          path: chernabog-${{ env.TAG }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  attach:
    needs: [plan, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.binary-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - run: (cd assets && sha256sum *.tar.gz > "chernabog-$TAG-sha256.txt")
      # --clobber, so a dispatched re-run replaces what a failed run left.
      - run: gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"

  # Points dataquail/homebrew-tap's formula at the binaries just attached, so
  # `brew upgrade chernabog` picks the release up.
  homebrew:
    needs: [plan, attach]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.binary-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # A dispatched re-run of an older tag must not move the formula back.
      - name: Check this is the newest release
        id: newest
        run: |
          newest=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[].tag_name | select(startswith("v"))][0]')
          if [ "$newest" != "$TAG" ]; then
            echo "$TAG is not the newest release ($newest); leaving the formula alone"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.newest.outputs.skip != 'true'
        id: app-token
        with:
          app-id: ${{ secrets.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}
          owner: dataquail
          repositories: homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.newest.outputs.skip != 'true'
        with:
          ref: ${{ env.TAG }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.newest.outputs.skip != 'true'
        with:
          repository: dataquail/homebrew-tap
          path: tap
          token: ${{ steps.app-token.outputs.token }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.newest.outputs.skip != 'true'
        with:
          bun-version: 1.4.3
      - name: Commit the formula
        if: steps.newest.outputs.skip != 'true'
        run: |
          bun install --frozen-lockfile --ignore-scripts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "chernabog-$TAG-sha256.txt"
          mkdir -p tap/Formula
          bun scripts/homebrew-formula.ts "$TAG" "chernabog-$TAG-sha256.txt" > tap/Formula/chernabog.rb
          cd tap
          git diff --quiet && git ls-files --error-unmatch Formula/chernabog.rb >/dev/null 2>&1 && exit 0
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Formula/chernabog.rb
          git commit -m "chernabog ${TAG#v}"
          git push

  sdk:
    needs: plan
    if: needs.plan.outputs.sdk-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.plan.outputs.sdk-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      # Node 24's npm does trusted publishing: with id-token: write and
      # @chernabog/sdk's trusted publisher set on npmjs.com it needs no token,
      # and provenance comes with it. NPM_TOKEN is only for the first publish,
      # before the package exists to configure.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish @chernabog/sdk
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          [ "sdk-v$version" = "$TAG" ] || { echo "::error::$TAG holds @chernabog/sdk $version"; exit 1; }

          if npm view "@chernabog/sdk@$version" version >/dev/null 2>&1; then
            echo "@chernabog/sdk@$version is already on the registry"
            exit 0
          fi

          # npm gives `latest` to whatever it publishes unless told otherwise,
          # so a prerelease goes out under its own tag: 0.2.0-beta.1 -> beta.
          dist_tag=latest
          case "$version" in
            *-*)
              prerelease=${version#*-}
              dist_tag=${prerelease%%.*}
              [[ "$dist_tag" =~ ^[0-9]+$ ]] && dist_tag=next
              ;;
          esac

          npm publish --provenance --tag "$dist_tag"

  # The docs describe what was just released, so they deploy only once the SDK
  # is on npm, built from the tag that published it.
  docs:
    needs: [plan, sdk]
    if: needs.sdk.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.plan.outputs.sdk-tag }}
