name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # oxlint runs the vendored TypeScript lint plugins on Node's type stripping (22.6+).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - run: CHERNABOG_BIN=$PWD/dist/chernabog bun test test/acceptance/e2e.test.ts test/acceptance/daemon.test.ts
