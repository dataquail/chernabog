name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # oxlint runs the vendored TypeScript lint plugins on Node's type stripping (22.6+).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run format:check
      - run: bun run lint
      - run: bun run lint:architecture
      # Measures coverage too (bunfig.toml). Prints the runner's load each
      # minute, which streams live even if the runner stops answering, and
      # fails a hang at 20 minutes so its log is kept.
      - run: |
          (while sleep 60; do
            echo "::group::runner at $(date -u +%T): $(ps -e --no-headers | wc -l) processes"
            uptime
            df -h / /tmp | tail -n +2
            ps -eo pid,pgid,etimes,pcpu,rss,args --sort=-pcpu | head -15 | cut -c1-200
            echo "::endgroup::"
          done) &
          sampler=$!
          set +e
          bun test
          status=$?
          kill "$sampler"
          exit "$status"
        timeout-minutes: 20
      # What the acceptance tests' sandboxes were doing when the tests failed or hung.
      - if: failure()
        run: |
          ps -eo pid,pgid,etimes,pcpu,rss,args --sort=-pcpu | head -30 | cut -c1-200
          df -h / /tmp
          for dir in /tmp/chernabog-e2e-*; do
            echo "::group::$dir"
            for log in claude.log tmux.log home/daemon.log; do
              if [ -f "$dir/$log" ]; then
                echo "== $log ($(wc -c < "$dir/$log") bytes)"
                tail -40 "$dir/$log" | cut -c1-300
              fi
            done
            echo "::endgroup::"
          done
      # The coverage table in the job summary, even when the tests failed; fails below the floor.
      - if: always()
        run: bun scripts/coverage-summary.ts
      - run: bun run build
      - run: CHERNABOG_BIN=$PWD/dist/chernabog bun test test/acceptance/e2e.test.ts test/acceptance/daemon.test.ts

  # Only builds the site, so a broken page fails here rather than at release.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run build
        working-directory: website
