name: PR title

# A squash merge makes the PR title the commit on main, and release-please reads
# those commits to decide the next version and write the changelog.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9/._-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::\"$TITLE\" is not a conventional commit, such as \"feat(daemon): pause on usage limits\" or \"fix!: ...\""
            exit 1
          fi
